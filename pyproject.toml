[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "epat"
version = "0.1.0"
description = "End-to-end algorithmic trading toolkit derived from the EPAT curriculum (data, indicators, strategies, backtesting, risk, metrics, options, ML)."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
]

[project.optional-dependencies]
extras = ["scipy>=1.11", "scikit-learn>=1.4", "matplotlib>=3.8"]
# Interactive Brokers adapter only (Zerodha/Upstox use the stdlib HTTP client).
ib = ["ib_insync>=0.9.86"]

[project.scripts]
epat = "epat.cli:main"

[tool.setuptools.packages.find]
include = ["epat*"]
